<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Nazario</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:        #111008;
      --bg-card:   #161409;
      --bg-muted:  #1e1c10;
      --text:      #ffffff;
      --text-muted:#888888;
      --text-dim:  #555555;
      --accent:    #f5a623;
      --border:    #2a2820;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
    }

    .nav-logo {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.875rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <nav>
    <span class="nav-logo">Michael Nazario</span>
    <ul class="nav-links">
      <li><a href="#photos">Photos</a></li>
      <li><a href="#writing">Writing</a></li>
      <li><a href="#code">GitHub</a></li>
    </ul>
  </nav>
</body>
</html>
